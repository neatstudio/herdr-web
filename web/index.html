<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The page names the daemon it reaches; Masthead sets this at runtime. -->
    <title>herdr</title>
    <!-- Inline so a self-hosted instance never 404s on a favicon request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a0b'/%3E%3Crect x='3' y='3' width='10' height='3' fill='%23ff7a45'/%3E%3Crect x='3' y='8' width='6' height='2' fill='%23e9e7e0'/%3E%3Crect x='3' y='11' width='8' height='2' fill='%23e9e7e0'/%3E%3C/svg%3E"
    />
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong palette. Mirrors src/lib/theme.ts: a stored choice wins,
      // otherwise follow the OS.
      (function () {
        try {
          var stored = localStorage.getItem("herdr-web-theme");
          var mode = stored === "light" || stored === "dark" ? stored : null;
          if (!mode) {
            mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = mode;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      /* The boot shell: on a relay the bundle takes a couple of seconds to
         arrive, and a blank page reads as "broken". This is painted from the
         HTML itself, so it appears with the first byte. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 10px;
        background: #0a0a0b;
        color: #e9e7e0;
        font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      html[data-theme="light"] #boot {
        background: #f3f0e8;
        color: #1c1b18;
      }
      #boot span[aria-hidden] {
        display: block;
        width: 12px;
        height: 12px;
        margin: 0 auto 10px;
        background: #ff7a45;
      }
      #boot small {
        display: block;
        margin-top: 8px;
        font-size: 10px;
        letter-spacing: 0.18em;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <div id="boot"><div><span aria-hidden></span>herdr<small>connecting</small></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
