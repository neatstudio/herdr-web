name: release

# A tag publishes the console for every platform, so install.sh has something to
# download. The binaries are self-contained (the frontend is embedded), which is
# what lets a machine with no Go, no Node and no network end up with a working
# console from a single file.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build the frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: build every platform
        run: make release-archives

      - name: check the tests before publishing
        run: |
          go test ./...
          cd web && npm run test:unit

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/herdr-web-*
          body: |
            Self-contained herdr-web binaries. Each one embeds the frontend; no
            Go, Node or network access is needed on the machine that runs it.

            Install and register the service:

                curl -fsSL https://github.com/neatstudio/herdr-web/releases/latest/download/install.sh | sh

            If that host is unreachable, copy the binary for your platform over
            and run:

                sh install.sh --from ./herdr-web-linux-amd64
          draft: false
          prerelease: false

      - name: attach the installer
        run: |
          gh release upload "${GITHUB_REF_NAME}" install.sh --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
